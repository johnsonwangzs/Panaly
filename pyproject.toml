[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panaly"
version = "0.1.0"
description = "Analyze academic conference topics and trends from paper titles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "bibtexparser>=1.4,<2",
    "matplotlib>=3.7,<4",
    "wordcloud>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
llm = ["openai>=1,<3"]

[project.scripts]
panaly = "panaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["local_data: regression checks using the existing resources directory"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["resources", "data", "outputs", "extract_keyword.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
